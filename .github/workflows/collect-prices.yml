name: Collect gold bar prices

on:

  schedule:
  
    - cron: "23 * * * *"
    
  workflow_dispatch:
  
permissions:

  contents: write
  
concurrency:

  group: gold-price-collection
  
  cancel-in-progress: false
  
jobs:

  collect:
  
    runs-on: ubuntu-latest
    
    timeout-minutes: 10
    
    steps:
    
      - name: Check out repository
      
        uses: actions/checkout@v4
        
      - name: Set up Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: "3.12"
          
          cache: pip
          
      - name: Install collector dependencies
      
        run: python -m pip install -r requirements.txt
        
      - name: Run collector and migrate legacy history if needed
      
        run: python scripts/collect_prices.py
        
      - name: Commit collected history
      
        run: |
        
          git config user.name "gold-price-bot"
          
          git config user.email "action@github.com"
          
          git add public/data/history.csv
          
          if git diff --cached --quiet; then
          
            echo "No new data to commit."
            
          else
          
            git commit -m "data: collect gold prices at $(date -u +'%Y-%m-%d %H:%M UTC')"
            
            git push
            
          fi






























